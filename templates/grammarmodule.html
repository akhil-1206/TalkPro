<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkpro | Grammar Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(to bottom, #08050c, #3d027e); color: white; min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.96); color: #1a013e; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .option-btn { border: 2px solid #e9d5ff; background: #fdf4ff; color: #1a013e; transition: all 0.2s ease; }
        .option-btn:hover, .option-btn.selected { border-color: #9333ea; background: #f3e8ff; color: #6b21a8; font-weight: 600; }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <nav class="bg-[#1a013e] px-6 py-4 flex items-center justify-between border-b border-purple-900/40 sticky top-0 z-50">
        <a href="/dashboard" class="text-2xl font-bold text-white">TalkPro</a>
        <a href="/modules" class="text-xs bg-purple-900/80 hover:bg-purple-800 text-purple-200 px-3.5 py-2 rounded-xl border border-purple-500/30 transition">← Exit Test</a>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-2xl flex flex-col justify-center">
        <div class="glass-card p-8 space-y-6 relative overflow-hidden">
            <!-- Progress Bar & Timer -->
            <div>
                <div class="flex justify-between items-center text-xs font-bold text-purple-900 mb-2">
                    <span id="questionNumText">Question 1 of 5</span>
                    <span id="timerText" class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full"><i class="fa-regular fa-clock mr-1"></i> 20s remaining</span>
                </div>
                <div class="w-full bg-purple-100 h-3 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-purple-600 to-indigo-600 h-full w-[20%] transition-all duration-300"></div>
                </div>
            </div>

            <!-- Question Text -->
            <h2 id="questionText" class="text-xl font-bold text-purple-950 text-center py-2">
                Loading Grammar Question...
            </h2>

            <!-- Options Container -->
            <div id="optionsContainer" class="space-y-3">
            </div>

            <button id="nextBtn" class="w-full py-3.5 bg-purple-700 hover:bg-purple-800 text-white font-bold rounded-xl shadow-lg transition">
                Next Question →
            </button>
        </div>
    </main>

    <!-- Modal Results Overlay -->
    <div id="resultModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass-card p-8 max-w-md w-full text-center space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="w-20 h-20 bg-purple-100 text-purple-700 rounded-full flex items-center justify-center text-4xl mx-auto shadow-inner">
                <i class="fa-solid fa-trophy text-amber-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900">Grammar Test Completed!</h2>
            <p id="scoreSummary" class="text-lg font-semibold text-purple-800">You scored 80% (4 out of 5)!</p>
            <p class="text-xs text-gray-600">Your score has been updated on your profile progress tracker.</p>
            
            <div id="reviewContainer" class="text-left bg-purple-50 p-4 rounded-xl space-y-2 text-xs text-purple-950 border border-purple-200">
                <strong class="block text-sm text-purple-900 mb-1">Answer Explanations:</strong>
                <div id="reviewList" class="space-y-2"></div>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button onclick="location.reload()" class="flex-1 py-3 bg-purple-100 hover:bg-purple-200 text-purple-800 font-bold rounded-xl text-xs transition">
                    Retake Test
                </button>
                <a href="/profile" class="flex-1 py-3 bg-purple-700 hover:bg-purple-800 text-white font-bold rounded-xl text-xs transition shadow text-center">
                    View Profile
                </a>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { q: "She ___ to school every morning.", options: ["goes", "go", "going", "gone"], answer: 0, exp: "'Goes' is the correct 3rd person singular present tense for 'She'." },
            { q: "Choose the correct past tense: 'He ___ a new car last week.'", options: ["buyed", "bought", "buying", "buys"], answer: 1, exp: "'Bought' is the irregular past tense form of 'buy'." },
            { q: "Identify the correct article: 'She has ___ unique opportunity.'", options: ["a", "an", "the", "no article"], answer: 0, exp: "'Unique' starts with a consonant 'yu' sound, requiring 'a', not 'an'." },
            { q: "Fill in the blank: 'If I ___ rich, I would travel the world.'", options: ["was", "were", "am", "is"], answer: 1, exp: "Subjunctive conditional clauses use 'were' (e.g. 'If I were rich')." },
            { q: "Select the sentence with correct grammar:", options: ["Neither of them are coming.", "Neither of them is coming.", "Neither of them be coming.", "Neither of them coming."], answer: 1, exp: "'Neither of them' is grammatically singular and takes the singular verb 'is'." }
        ];

        let currentQ = 0;
        let score = 0;
        let selectedOpt = null;
        let timeLeft = 20;
        let timerInterval = null;

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 20;
            $("#timerText").html(`<i class="fa-regular fa-clock mr-1"></i> ${timeLeft}s remaining`);
            
            timerInterval = setInterval(() => {
                timeLeft--;
                $("#timerText").html(`<i class="fa-regular fa-clock mr-1"></i> ${timeLeft}s remaining`);
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    $("#nextBtn").click();
                }
            }, 1000);
        }

        function loadQuestion() {
            selectedOpt = null;
            const q = questions[currentQ];
            $("#questionNumText").text(`Question ${currentQ + 1} of ${questions.length}`);
            $("#progressBar").css('width', `${((currentQ + 1) / questions.length) * 100}%`);
            $("#questionText").text(`Q${currentQ + 1}: ${q.q}`);
            
            let html = '';
            q.options.forEach((opt, idx) => {
                html += `<button onclick="selectOption(${idx})" class="option-btn option-${idx} w-full p-3.5 rounded-xl text-left text-sm font-medium flex items-center justify-between">
                            <span>${opt}</span>
                            <i class="fa-regular fa-circle text-purple-400"></i>
                        </button>`;
            });
            $("#optionsContainer").html(html);
            startTimer();
        }

        window.selectOption = function(idx) {
            selectedOpt = idx;
            $(".option-btn").removeClass('selected').find('i').attr('class', 'fa-regular fa-circle text-purple-400');
            $(`.option-${idx}`).addClass('selected').find('i').attr('class', 'fa-solid fa-circle-check text-purple-700');
        };

        $("#nextBtn").click(function() {
            if (selectedOpt === null && timeLeft > 0) {
                alert("Please select an answer before continuing!");
                return;
            }

            if (selectedOpt === questions[currentQ].answer) {
                score++;
            }

            currentQ++;

            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                clearInterval(timerInterval);
                finishQuiz();
            }
        });

        function finishQuiz() {
            const finalScorePct = Math.round((score / questions.length) * 100);
            $("#scoreSummary").text(`You scored ${finalScorePct}% (${score} out of ${questions.length})!`);
            
            let reviewHtml = '';
            questions.forEach((q, idx) => {
                reviewHtml += `<div class="border-b border-purple-200/70 pb-1.5 mb-1.5">
                    <strong>Q${idx+1}:</strong> ${q.q}<br>
                    <span class="text-emerald-700 font-semibold">✓ Correct Answer:</span> ${q.options[q.answer]}<br>
                    <span class="text-gray-600">${q.exp}</span>
                </div>`;
            });
            $("#reviewList").html(reviewHtml);

            // Submit to server
            $.ajax({
                url: '/submit_test',
                method: 'POST',
                data: { module: 'grammar', score: finalScorePct },
                success: function() {
                    $("#resultModal").removeClass('hidden');
                },
                error: function() {
                    $("#resultModal").removeClass('hidden');
                }
            });
        }

        loadQuestion();
    </script>
</body>
</html>
