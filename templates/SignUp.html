<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkpro | Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #08050c 0%, #3d027e 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md glass-card rounded-2xl p-8 relative overflow-hidden">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-purple-100 rounded-full text-purple-700 mb-2 shadow-inner">
                <i class="fa-solid fa-user-plus text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Sign Up to Talkpro</h1>
            <p class="text-sm text-gray-600 mt-1">Start your journey to English fluency</p>
        </div>

        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-700 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="alertMessage"></span>
        </div>

        <form id="signupForm" action="/signup" method="POST" class="space-y-4">
            <!-- Full Name -->
            <div>
                <label for="name" class="block text-xs font-semibold uppercase text-gray-700 mb-1">Full Name</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <input type="text" id="name" name="name" required placeholder="John Doe"
                        class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition">
                </div>
            </div>

            <!-- Email Input -->
            <div>
                <label for="email" class="block text-xs font-semibold uppercase text-gray-700 mb-1">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input type="email" id="email" name="email" required placeholder="name@example.com"
                        class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition">
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-xs font-semibold uppercase text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition">
                </div>
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="Confirm_password" class="block text-xs font-semibold uppercase text-gray-700 mb-1">Confirm Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="Confirm_password" name="Confirm_password" required minlength="6" placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 px-4 bg-purple-700 hover:bg-purple-800 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>Create Account</span> <i class="fa-solid fa-user-check text-xs"></i>
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-200 text-center">
            <p class="text-sm text-gray-600">
                Already a learner? <a href="/login" class="font-semibold text-purple-700 hover:underline">Log in</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirm = document.getElementById('Confirm_password').value.trim();

            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMessage');
            const submitBtn = document.getElementById('submitBtn');

            alertBox.classList.add('hidden');

            if (password !== confirm) {
                alertMsg.textContent = "Passwords do not match!";
                alertBox.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Registering...`;

            try {
                const formData = new FormData();
                formData.append('name', name);
                formData.append('email', email);
                formData.append('password', password);
                formData.append('Confirm_password', confirm);

                const res = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    body: formData
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = '/user-details';
                } else {
                    alertMsg.textContent = data.message || "Registration failed.";
                    alertBox.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Create Account</span> <i class="fa-solid fa-user-check text-xs"></i>`;
                }
            } catch (err) {
                alertMsg.textContent = "Server connection error.";
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Create Account</span> <i class="fa-solid fa-user-check text-xs"></i>`;
            }
        });
    </script>
</body>
</html>
