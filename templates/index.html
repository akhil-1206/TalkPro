<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talkpro | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #08050c 0%, #3d027e 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md glass-card rounded-2xl p-8 relative overflow-hidden">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-purple-100 rounded-full text-purple-700 mb-3 shadow-inner">
                <i class="fa-solid fa-comments text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Welcome to Talkpro</h1>
            <p class="text-sm text-gray-600 mt-1">Log in to continue your language learning journey</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded-lg text-sm font-medium {% if category == 'danger' %}bg-red-100 text-red-700{% elif category == 'success' %}bg-green-100 text-green-700{% else %}bg-purple-100 text-purple-700{% endif %} flex items-center gap-2">
                <i class="fa-solid fa-circle-info"></i> {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium bg-red-100 text-red-700 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="alertMessage"></span>
        </div>

        <form id="loginForm" action="/login" method="POST" class="space-y-5">
            <!-- Email Input -->
            <div>
                <label for="email" class="block text-xs font-semibold uppercase text-gray-700 mb-1">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <input type="email" id="email" name="email" required placeholder="name@example.com"
                        class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition">
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="block text-xs font-semibold uppercase text-gray-700">Password</label>
                    <a href="/forgot_password" class="text-xs font-semibold text-purple-600 hover:text-purple-800 hover:underline">Forgot password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" name="password" required minlength="4" placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 px-4 bg-purple-700 hover:bg-purple-800 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                <span>Log In</span> <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-200 text-center">
            <p class="text-sm text-gray-600">
                New learner? <a href="/signup" class="font-semibold text-purple-700 hover:underline">Create an account</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMessage');
            const submitBtn = document.getElementById('submitBtn');

            alertBox.classList.add('hidden');

            if (!email || !password) {
                alertMsg.textContent = "Please fill in all fields.";
                alertBox.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Logging in...`;

            try {
                const formData = new FormData();
                formData.append('email', email);
                formData.append('password', password);

                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    body: formData
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    if (data.detailsFilled) {
                        window.location.href = '/dashboard';
                    } else {
                        window.location.href = '/user-details';
                    }
                } else {
                    alertMsg.textContent = data.message || "Invalid credentials.";
                    alertBox.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Log In</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
                }
            } catch (err) {
                alertMsg.textContent = "Server connection error. Please try again.";
                alertBox.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Log In</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        });
    </script>
</body>
</html>
